<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8" />
    <title>RectangleGeometry (X Y X+W Y+H) 生成器</title>
    <style>
        body {
            font-family: Arial, "Microsoft Yahei";
            padding: 18px;
            max-width: 820px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }

        input {
            padding: 6px 8px;
            margin-top: 6px;
            width: 160px;
        }

        button {
            margin-top: 12px;
            padding: 8px 14px;
        }

        textarea {
            width: 100%;
            height: 220px;
            margin-top: 12px;
            font-family: Consolas, monospace;
            font-size: 13px;
        }

        .row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 6px;
        }

        .preview {
            border: 1px solid #ccc;
            margin-top: 12px;
            width: 100%;
            height: 120px;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: white;
        }
    </style>
</head>

<body>

    <h2>RectangleGeometry 生成器 — Rect="X Y X+W Y+H"</h2>

    <div class="row">
        <div>
            <label>大矩形 宽 (px)</label>
            <input id="bigW"
                type="number"
                value="800" />
        </div>
        <div>
            <label>大矩形 高 (px)</label>
            <input id="bigH"
                type="number"
                value="100" />
        </div>
    </div>

    <div class="row">
        <div>
            <label>小矩形 宽 (px)</label>
            <input id="smallW"
                type="number"
                value="50" />
        </div>
        <div>
            <label>小矩形 数量</label>
            <input id="count"
                type="number"
                value="6" />
        </div>
    </div>

    <button id="genBtn">生成 RectangleGeometry</button>
    <button id="copyBtn">复制到剪贴板</button>
    <button id="visualBtn">切换预览显示</button>

    <textarea id="output"
        readonly
        placeholder="生成结果会显示在这里..."></textarea>

    <div class="preview"
        id="previewWrap"
        style="display:none;">
        <canvas id="canvas"
            width="760"
            height="100"></canvas>
    </div>

    <script>
        const genBtn = document.getElementById('genBtn');
        const copyBtn = document.getElementById('copyBtn');
        const visualBtn = document.getElementById('visualBtn');
        const output = document.getElementById('output');
        const previewWrap = document.getElementById('previewWrap');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function formatNum(n) {
            // 避免长小数，保留最多 2 位
            return Number.isInteger(n) ? String(n) : n.toFixed(2);
        }

        function generateText() {
            const bigW = parseFloat(document.getElementById('bigW').value);
            const bigH = parseFloat(document.getElementById('bigH').value);
            const smallW = parseFloat(document.getElementById('smallW').value);
            const count = parseInt(document.getElementById('count').value, 10);

            if (!isFinite(bigW) || !isFinite(bigH) || !isFinite(smallW) || !isFinite(count) ||
                bigW <= 0 || bigH <= 0 || smallW <= 0 || count <= 0) {
                alert('请输入有效的正数参数。');
                return '';
            }

            const totalSmall = smallW * count;
            if (totalSmall > bigW) {
                alert('小矩形总宽度超过大矩形宽度，请减小小矩形宽度或数量。');
                return '';
            }

            // 均匀分布：gap 为两端与间隙都相等 => gap = (bigW - totalSmall) / (count + 1)
            const gap = (bigW - totalSmall) / (count + 1);

            let lines = '';
            const y = 0;
            const y2 = y + bigH;

            for (let i = 0; i < count; i++) {
                const x = gap + i * (smallW + gap); // start at gap, 每项占 smallW + gap
                const x2 = x + smallW;
                // 输出格式：X Y X+宽度 Y+高度 （空格分隔）
                lines += `<RectangleGeometry Rect="${formatNum(x)} ${formatNum(y)} ${formatNum(x2)} ${formatNum(y2)}" />\n`;
            }

            return {
                text: lines,
                meta: { bigW, bigH, smallW, count, gap }
            };
        }

        function renderPreview(meta) {
            if (!meta) return;
            const dW = meta.bigW;
            const dH = meta.bigH;
            const viewW = canvas.width;
            const viewH = canvas.height;

            // 等比缩放到画布宽度内（保留少量边距）
            const padding = 8;
            const scale = Math.min((viewW - padding * 2) / dW, (viewH - padding * 2) / dH);

            // 清空
            ctx.clearRect(0, 0, viewW, viewH);
            // 画大矩形（中心垂直）
            const bigRectW = dW * scale;
            const bigRectH = dH * scale;
            const ox = (viewW - bigRectW) / 2;
            const oy = (viewH - bigRectH) / 2;

            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.strokeRect(ox, oy, bigRectW, bigRectH);

            // 画小矩形
            for (let i = 0; i < meta.count; i++) {
                const x = (meta.gap + i * (meta.smallW + meta.gap)) * scale + ox;
                const y = oy;
                const w = meta.smallW * scale;
                const h = bigRectH;

                ctx.fillStyle = '#76a5ff';
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = '#2b5fb3';
                ctx.strokeRect(x, y, w, h);
            }
        }

        genBtn.addEventListener('click', () => {
            const res = generateText();
            if (!res) return;
            output.value = res.text;
            // 把 meta 存在 textarea 的 dataset 里，供预览使用
            output.dataset.meta = JSON.stringify(res.meta);
            if (previewWrap.style.display !== 'none') {
                renderPreview(res.meta);
            }
        });

        copyBtn.addEventListener('click', async () => {
            if (!output.value) {
                alert('请先生成内容再复制。');
                return;
            }
            try {
                await navigator.clipboard.writeText(output.value);
                alert('已复制到剪贴板！');
            } catch (e) {
                // 退回到选中复制的方式
                output.select();
                document.execCommand('copy');
                alert('已复制（备用方法）。');
            }
        });

        visualBtn.addEventListener('click', () => {
            if (previewWrap.style.display === 'none') {
                previewWrap.style.display = 'flex';
                // 若已有 meta，则渲染
                if (output.dataset.meta) {
                    const meta = JSON.parse(output.dataset.meta);
                    renderPreview(meta);
                } else {
                    // 若未生成，自动生成一次
                    const res = generateText();
                    if (res) {
                        output.value = res.text;
                        output.dataset.meta = JSON.stringify(res.meta);
                        renderPreview(res.meta);
                    }
                }
            } else {
                previewWrap.style.display = 'none';
            }
        });
    </script>

</body>

</html>
